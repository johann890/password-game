<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        background:
          radial-gradient(1000px 520px at 50% -14%, rgba(0, 113, 227, 0.09), transparent 72%),
          radial-gradient(circle at 1px 1px, #e4e4ea 1px, transparent 0) 0 0 / 22px 22px,
          #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 92px;
        position: relative;
      }
      h1 {
        font-size: 94px;
        font-weight: 600;
        letter-spacing: -0.045em;
        color: #1d1d1f;
        line-height: 1.1;
        display: flex;
        align-items: center;
      }
      .caret {
        display: inline-block;
        width: 0.5em;
        height: 0.88em;
        background: #1d1d1f;
        margin-left: 0.04em;
      }
      p {
        margin-top: 34px;
        font-size: 29px;
        line-height: 1.55;
        color: #6e6e73;
        letter-spacing: -0.01em;
      }
      .kicker {
        position: absolute;
        left: 92px;
        bottom: 74px;
        font-size: 20px;
        letter-spacing: 0.16em;
        color: #86868b;
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 12px;
        background: #0071e3;
      }
    </style>
  </head>
  <body>
    <h1>P4ssw0rdle<span class="caret"></span></h1>
    <p>One password. Eight rules that fight back.<br />A new puzzle every day.</p>
    <div class="kicker">A DAILY PASSWORD PUZZLE</div>
    <div class="bar"></div>
  </body>
</html>
