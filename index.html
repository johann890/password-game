<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passwordle — the daily password puzzle</title>
    <meta name="description" content="One password, eight rules. A new puzzle every day." />
    <meta name="theme-color" content="#ffffff" />

    <!--
      Paint in the right theme from the first frame. Running this before the
      stylesheet loads is the only way to avoid a white flash on a dark
      screen, so it has to live here rather than in React. The accessibility
      settings ride along for the same reason: someone who has asked for high
      contrast or large text should never be shown a frame without it.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var saved = localStorage.getItem('passwordle.theme.v1');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          root.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'dark' ? '#121214' : '#ffffff');
        } catch (e) {
          /* Light it is. */
        }
        try {
          var s = JSON.parse(localStorage.getItem('passwordle.settings.v1') || '{}');
          // Until they say otherwise, follow the contrast the system asks for,
          // the same way the theme follows the system's light and dark.
          root.dataset.contrast = s.contrast === 'high' || s.contrast === 'normal'
            ? s.contrast
            : matchMedia('(prefers-contrast: more)').matches ? 'high' : 'normal';
          root.dataset.text = s.text === 'small' || s.text === 'large' ? s.text : 'regular';
        } catch (e) {
          root.dataset.contrast = 'normal';
          root.dataset.text = 'regular';
        }
      })();
    </script>

    <!--
      Social preview. og:image should be an absolute URL once this is deployed
      (https://your-domain/og.jpg) — Facebook in particular will not resolve a
      relative one. Regenerate the image from design/og-card.html.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Passwordle" />
    <meta property="og:title" content="Passwordle — the daily password puzzle" />
    <meta
      property="og:description"
      content="One password. Eight rules that fight back. A new puzzle every day."
    />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="420" />
    <meta property="og:image:alt" content="Passwordle, a daily password puzzle" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Passwordle — the daily password puzzle" />
    <meta
      name="twitter:description"
      content="One password. Eight rules that fight back. A new puzzle every day."
    />
    <meta name="twitter:image" content="/og.jpg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-bg="dots-wash">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
